# Docker Compose configuration for production
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  web:
    build:
      target: production
    environment:
      - DEBUG=False
      - BUILD_TARGET=production
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  celery_worker:
    build:
      target: celery-worker
    environment:
      - DEBUG=False
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  celery_beat:
    build:
      target: celery-beat
    environment:
      - DEBUG=False
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Enable nginx for production
  nginx:
    profiles:
      - ""  # Enable by default in production

  # Disable flower in production
  flower:
    profiles:
      - never  # Never enable in production