{% extends 'readings/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto text-center">
    <h2 class="text-3xl mb-8">Welcome to Mystic Tarot Readings</h2>
    
    <form action="{% url 'readings:get_reading' %}" method="post" class="space-y-6">
        {% csrf_token %}
        <div class="space-y-4">
            <h3 class="text-xl">Choose Your Reading Type</h3>
            <div class="flex flex-col space-y-4">
                <button type="submit" name="reading_type" value="1" 
                        class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg">
                    Single Card Reading
                </button>
                <button type="submit" name="reading_type" value="3"
                        class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg">
                    Three Card Reading
                </button>
                <button type="submit" name="reading_type" value="5"
                        class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg">
                    Five Card Cross
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
